<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer — Grammatica & Quiz A1–C2</title>
<style>
  :root { color-scheme: light; --blue:#4f7cff; --pur:#8a5cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f6f7fb; color:#1d2433; line-height:1.55; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 18px 16px 70px; }
  header.top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .logo { width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,var(--blue),var(--pur)); display:grid; place-items:center; color:#fff; font-weight:800; font-size:16px; }
  h1 { font-size:18px; margin:0; }
  .sub { font-size:12px; color:#6b7280; margin:0; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { background:#fff; border:1px solid #e6e8ef; border-radius:999px; padding:6px 12px; font-size:12px; color:#374151; display:flex; gap:6px; align-items:center; }
  .pill b { font-size:14px; color:#1d2433; }
  .controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .controls .lbl { font-size:13px; color:#6b7280; font-weight:600; }
  .seg { display:inline-flex; flex-wrap:wrap; background:#fff; border:1px solid #e6e8ef; border-radius:999px; padding:3px; gap:2px; }
  .seg button { border:none; background:transparent; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700; color:#6b7280; cursor:pointer; font-family:inherit; min-width:44px; }
  .seg button.active { background:linear-gradient(135deg,var(--blue),var(--pur)); color:#fff; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid #e6e8ef; }
  .tabs button { border:none; background:transparent; padding:10px 14px; font-size:14px; font-weight:600; color:#6b7280; cursor:pointer; font-family:inherit; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button.active { color:var(--blue); border-bottom-color:var(--blue); }
  .card { background:#fff; border:1px solid #e6e8ef; border-radius:16px; padding:20px; box-shadow:0 1px 2px rgba(16,24,40,.04); margin-bottom:14px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--blue); background:#eef2ff; padding:4px 10px; border-radius:999px; margin-bottom:10px; }
  h2.lesson-title { font-size:21px; margin:4px 0 12px; }
  .explain p { margin:0 0 10px; } .explain ul { margin:6px 0 12px; padding-left:20px; }
  .examples { margin-top:8px; border-top:1px solid #eef0f5; padding-top:12px; }
  .examples h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#6b7280; margin:0 0 8px; }
  .ex-row { display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed #eef0f5; font-size:14px; }
  .ex-row .en { font-weight:600; flex:1; } .ex-row .it { color:#6b7280; flex:1; }
  .section-label { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:#6b7280; margin:0 0 6px; }
  .q { margin-bottom:18px; } .q:last-child { margin-bottom:0; }
  .q-type { font-size:11px; font-weight:700; color:var(--pur); text-transform:uppercase; letter-spacing:.04em; }
  .q-text { font-size:15px; font-weight:600; margin:4px 0 10px; }
  .opts { display:grid; gap:8px; }
  .opt { text-align:left; border:1px solid #e6e8ef; background:#fff; border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; transition:all .12s; font-family:inherit; color:inherit; }
  .opt:hover:not(:disabled) { border-color:#b9c4ff; background:#f7f9ff; }
  .opt.correct { border-color:#16a34a; background:#ecfdf3; color:#14532d; }
  .opt.wrong { border-color:#dc2626; background:#fef2f2; color:#7f1d1d; }
  .opt:disabled { cursor:default; }
  input.txt { width:100%; border:1px solid #e6e8ef; border-radius:10px; padding:10px 14px; font-size:14px; font-family:inherit; color:inherit; }
  input.txt:focus { outline:none; border-color:#b9c4ff; }
  input.txt.correct { border-color:#16a34a; background:#ecfdf3; }
  input.txt.wrong { border-color:#dc2626; background:#fef2f2; }
  .check-btn { margin-top:8px; border:none; background:var(--blue); color:#fff; border-radius:10px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .check-btn:disabled { background:#c3ccdf; cursor:default; }
  .fb { font-size:13px; margin-top:8px; padding:8px 12px; border-radius:8px; display:none; }
  .fb.ok { background:#ecfdf3; color:#14532d; display:block; }
  .fb.no { background:#fef2f2; color:#7f1d1d; display:block; }
  .fb .sol { font-weight:700; }
  .primary-btn { border:none; background:linear-gradient(135deg,var(--blue),var(--pur)); color:#fff; border-radius:12px; padding:11px 20px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 2px 8px rgba(79,124,255,.3); }
  .ghost-btn { border:1px solid #e6e8ef; background:#fff; color:#374151; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .center { text-align:center; }
  .muted { color:#6b7280; font-size:13px; }
  .result-score { font-size:40px; font-weight:800; background:linear-gradient(135deg,var(--blue),var(--pur)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .hidden { display:none !important; }
  .grammar-item { border:1px solid #e6e8ef; border-radius:12px; margin-bottom:10px; overflow:hidden; background:#fff; }
  .grammar-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; font-weight:700; font-size:15px; }
  .grammar-head:hover { background:#f7f9ff; }
  .grammar-head .chev { color:#9ca3af; transition:transform .2s; }
  .grammar-item.open .chev { transform:rotate(90deg); }
  .grammar-body { display:none; padding:0 16px 16px; font-size:14px; }
  .grammar-item.open .grammar-body { display:block; }
  .badge-done { font-size:11px; color:#16a34a; font-weight:700; }
  .topic-picker { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { border:1px solid #e6e8ef; background:#fff; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; font-family:inherit; color:#374151; }
  .chip.active { background:#eef2ff; border-color:#b9c4ff; color:var(--blue); font-weight:700; }
  .footer-note { font-size:12px; color:#9ca3af; text-align:center; margin-top:18px; }
  .progress-bar { height:6px; background:#eef0f5; border-radius:999px; overflow:hidden; margin:10px 0 16px; }
  .progress-bar > div { height:100%; background:linear-gradient(90deg,var(--blue),var(--pur)); width:0; transition:width .3s; }
  .reset-link { background:none; border:none; color:#9ca3af; font-size:12px; cursor:pointer; text-decoration:underline; font-family:inherit; }
  @media (max-width: 560px) {
    .wrap { padding: 14px 12px 64px; }
    header.top { gap:8px; }
    h1 { font-size:17px; }
    .stats { width:100%; }
    .pill { padding:5px 10px; font-size:11px; flex:1; justify-content:center; }
    .tabs { flex-wrap:wrap; gap:4px; border-bottom:none; }
    .tabs button { flex:1 1 30%; border:1px solid #e6e8ef; border-radius:10px; padding:9px 6px; font-size:13px; text-align:center; }
    .tabs button.active { background:#eef2ff; border-color:#b9c4ff; }
    .card { padding:16px; border-radius:14px; }
    h2.lesson-title { font-size:19px; }
    .ex-row { flex-direction:column; gap:2px; padding:8px 0; }
    .ex-row .it { font-size:13px; }
    .seg button { padding:8px 14px; }
    .controls .lbl { width:100%; }
    .topic-picker { gap:6px; }
    .chip { padding:8px 12px; }
  }
  @media (hover: none) { .opt { padding:12px 14px; } input.txt { padding:12px 14px; font-size:16px; } }
  .cta-bright { border:none; color:#fff; border-radius:14px; padding:15px 26px; font-size:16px; font-weight:800;
    cursor:pointer; font-family:inherit; background:linear-gradient(135deg,#ff8a3d,#ff5b9a 55%,#8a5cff);
    background-size:200% 200%; box-shadow:0 6px 20px rgba(255,91,154,.45); animation:glow 2.2s ease-in-out infinite, shift 4s ease infinite; }
  .cta-bright:hover { transform:translateY(-1px); }
  @keyframes glow { 0%,100%{ box-shadow:0 6px 18px rgba(255,91,154,.35);} 50%{ box-shadow:0 8px 28px rgba(255,91,154,.7);} }
  @keyframes shift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  .gen-btn { border:none; color:#fff; border-radius:11px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
    background:linear-gradient(135deg,#ff8a3d,#ff5b9a); box-shadow:0 3px 12px rgba(255,91,154,.4); }
  .gen-btn:hover { filter:brightness(1.05); }
  .tip-item { border:1px solid #e6e8ef; border-radius:12px; margin-bottom:10px; background:#fff; padding:14px 16px; }
  .tip-cat { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:999px; margin-bottom:7px; }
  .tip-cat.falso { background:#fef3c7; color:#92400e; }
  .tip-cat.errore { background:#fee2e2; color:#991b1b; }
  .tip-cat.confondere { background:#e0e7ff; color:#3730a3; }
  .tip-item h4 { margin:2px 0 6px; font-size:15px; }
  .tip-item p { margin:0; font-size:14px; color:#374151; }
  .subnav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .subnav button { border:1px solid #e6e8ef; background:#fff; border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700; color:#374151; cursor:pointer; font-family:inherit; }
  .subnav button.active { background:#eef2ff; border-color:#b9c4ff; color:var(--blue); }
  .vtable { width:100%; border-collapse:collapse; font-size:14px; }
  .vtable th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#6b7280; padding:8px 10px; border-bottom:2px solid #eef0f5; position:sticky; top:0; background:#fff; }
  .vtable td { padding:9px 10px; border-bottom:1px solid #f1f3f8; }
  .vtable td:first-child { font-weight:700; }
  .vtable tr:hover td { background:#f7f9ff; }
  .vtable .it { color:#6b7280; }
  .ph-theme { font-size:13px; font-weight:800; color:var(--pur); text-transform:uppercase; letter-spacing:.03em; margin:16px 0 6px; }
  .search { width:100%; border:1px solid #e6e8ef; border-radius:10px; padding:10px 14px; font-size:14px; font-family:inherit; margin-bottom:12px; }
  .search:focus { outline:none; border-color:#b9c4ff; }
  .spk { border:none; background:#eef2ff; color:var(--blue); border-radius:8px; width:26px; height:26px; cursor:pointer; font-size:13px; line-height:1; padding:0; vertical-align:middle; margin-left:4px; }
  .spk:hover { background:#dde4ff; }
  .spk:active { transform:scale(.92); }
  .link-skip { background:none; border:none; color:#9ca3af; font-size:13px; cursor:pointer; text-decoration:underline; font-family:inherit; padding:6px; }
  .link-skip:hover { color:#6b7280; }
  .fb .expl { display:block; margin-top:4px; }
  .vocab-card { text-align:center; padding:30px 22px; }
  .vocab-word { font-size:34px; font-weight:800; margin:2px 0 2px; }
  .vocab-pos { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#8a5cff; font-weight:700; }
  .vocab-mean { font-size:18px; margin:14px 0 6px; color:#1d2433; }
  .vocab-ex { font-size:15px; color:#374151; font-style:italic; background:#f7f9ff; border-radius:10px; padding:12px 14px; margin:14px 0; }
  .spk-big { border:none; background:linear-gradient(135deg,var(--blue),var(--pur)); color:#fff; border-radius:999px; padding:8px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">EN</div>
      <div>
        <h1>English Trainer</h1>
        <p class="sub">Grammatica + quiz · livelli A1–C2 · spiegazioni in italiano</p>
      </div>
    </div>
    <div class="stats">
      <div class="pill">🔥 <b id="streak">0</b> giorni</div>
      <div class="pill">📘 <b id="done">0</b> lezioni</div>
      <div class="pill">🎯 <b id="acc">0</b> risposte ok</div>
    </div>
  </header>

  <div class="controls">
    <span class="lbl">Livello:</span>
    <div class="seg" id="levelSeg">
      <button data-lv="A1">A1</button><button data-lv="A2">A2</button>
      <button data-lv="B1">B1</button><button data-lv="B2">B2</button>
      <button data-lv="C1">C1</button><button data-lv="C2">C2</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="today" class="active">📅 Lezione di oggi</button>
    <button data-tab="grammar">📖 Grammatica</button>
    <button data-tab="quiz">✍️ Esercizi</button>
    <button data-tab="tips">💡 Suggerimenti</button>
    <button data-tab="res">📚 Risorse</button>
    <button data-tab="vocab">🗣️ Vocaboli</button>
  </div>

  <div id="view"></div>

  <div class="footer-note">
    I tuoi progressi sono salvati automaticamente su questo dispositivo/browser. ·
    <button class="reset-link" id="resetBtn">Azzera progressi</button>
  </div>
</div>

<script>
window.CURRICULUM = window.CURRICULUM || {};
window.CURRICULUM.A1 = [
{
  id:'a1-tobe', t:'Il verbo TO BE (essere)',
  g:`<p>Il verbo <b>to be</b> significa <i>essere</i> e cambia in base al soggetto: <b>I am</b>, <b>you are</b>, <b>he/she/it is</b>, <b>we/you/they are</b>.</p>
  <p>Forme contratte molto usate nel parlato: <i>I'm, you're, he's, she's, it's, we're, they're</i>.</p>
  <p>Per la <b>negazione</b> si aggiunge <b>not</b> (I am not / I'm not, she is not / she isn't). Per le <b>domande</b> si invertono soggetto e verbo: <i>Are you ready? Is he Italian?</i></p>
  <p>💡 <b>Attenzione, errore tipico italiano:</b> per età, fame, sete e paura l'inglese usa BE, non HAVE: si dice <i>I <b>am</b> 30 (years old)</i>, <i>I <b>am</b> hungry</i>, non "I have 30 years". Inoltre il soggetto non si omette mai: serve sempre <i>It is...</i>, non solo "Is...".</p>`,
  ex:[['I am a teacher.','Sono un insegnante.'],['She is at home.','Lei è a casa.'],['Are you tired?','Sei stanco?'],['They are not here.','Non sono qui.']],
  qz:[
    {ty:'mc', q:'She ___ a nurse.', o:['am','is','are','be'], a:1, e:'Con she si usa "is".'},
    {ty:'mc', q:'___ you ready?', o:['Am','Is','Are','Be'], a:2, e:'Con you si usa "are".'},
    {ty:'fill', q:'Completa con TO BE:', s:'They ___ my friends.', a:'are', acc:["'re"], e:'they → are.'},
    {ty:'fill', q:'Completa la negazione:', s:'I ___ not hungry.', a:'am', acc:["'m"], e:'I → am (I am not).'},
    {ty:'tr', q:'Traduci in inglese:', it:'Io sono italiano.', a:'I am Italian.', acc:["I'm Italian."], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:'He are happy.', a:'He is happy.', acc:[], e:'he → is.'}
  ]
},
{
  id:'a1-presentsimple', t:'Present Simple (presente semplice)',
  g:`<p>Si usa per <b>abitudini, fatti e situazioni permanenti</b>: <i>I work in Milan. Water boils at 100°C.</i></p>
  <p>Alla <b>terza persona singolare</b> (he/she/it) il verbo prende la <b>-s</b>: <i>he works, she plays, it rains</i>. Verbi in -o, -ss, -sh, -ch, -x prendono <b>-es</b> (goes, watches).</p>
  <p>Negazione e domanda usano l'ausiliare <b>do/does</b>: <i>I don't work. Does she work? He doesn't like tea.</i> Dopo does il verbo torna alla forma base (senza -s).</p>
  <p>💡 <b>Quando usarlo:</b> per ciò che è abituale o sempre vero (every day, usually, often, never). Avverbi di frequenza come <i>always, usually, often, never</i> vanno prima del verbo principale: <i>I <b>always</b> drink coffee</i>. Errore tipico: dimenticare la -s alla terza persona (he work ❌ → he works ✅).</p>`,
  ex:[['I drink coffee every morning.','Bevo caffè ogni mattina.'],['She works in a bank.','Lei lavora in banca.'],['Do you speak English?','Parli inglese?'],["He doesn't eat meat.",'Lui non mangia carne.']],
  qz:[
    {ty:'mc', q:'He ___ football on Sundays.', o:['play','plays','playes','is play'], a:1, e:'3ª persona → plays.'},
    {ty:'mc', q:'___ she like coffee?', o:['Do','Does','Is','Are'], a:1, e:'Con she → does.'},
    {ty:'fill', q:'Completa (3ª persona):', s:'My sister ___ (watch) TV every night.', a:'watches', acc:[], e:'watch + es.'},
    {ty:'fill', q:'Completa la negazione:', s:"They ___ live here.", a:"don't", acc:['do not'], e:'they → don\'t.'},
    {ty:'tr', q:'Traduci in inglese:', it:'Lei non parla francese.', a:"She doesn't speak French.", acc:['She does not speak French.'], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:'She don\'t like fish.', a:"She doesn't like fish.", acc:['She does not like fish.'], e:'con she → doesn\'t.'}
  ]
},
{
  id:'a1-presentcont', t:'Present Continuous (presente progressivo)',
  g:`<p>Si forma con <b>to be + verbo-ing</b> e descrive <b>azioni in corso ora</b> o intorno a questo periodo: <i>I am working now. She is studying English this year.</i></p>
  <p>Note ortografiche: make → mak<b>ing</b>, run → run<b>ning</b> (raddoppio), lie → l<b>ying</b>.</p>
  <p>Domanda: <i>What are you doing?</i> Negazione: <i>They aren't sleeping.</i></p>
  <p>💡 <b>Present simple o continuous?</b> Il simple è per abitudini (<i>I work every day</i>), il continuous per ciò che accade adesso (<i>I'm working now</i>). I verbi di stato (<i>know, like, want, need, believe</i>) di solito NON vanno al continuous: si dice <i>I like it</i>, non "I am liking it".</p>`,
  ex:[['I am reading a book.','Sto leggendo un libro.'],['What are you doing?','Cosa stai facendo?'],['It is raining.','Sta piovendo.'],["We aren't working today.",'Oggi non stiamo lavorando.']],
  qz:[
    {ty:'mc', q:'Look! It ___ .', o:['rains','is raining','rain','raining'], a:1, e:'azione ora → is raining.'},
    {ty:'mc', q:'What ___ you doing?', o:['is','am','are','do'], a:2, e:'you → are.'},
    {ty:'fill', q:'Completa (-ing):', s:'She is ___ (run) in the park.', a:'running', acc:[], e:'run → running (raddoppio).'},
    {ty:'fill', q:'Completa:', s:'They ___ watching a film right now.', a:'are', acc:["'re"], e:'they → are.'},
    {ty:'tr', q:'Traduci in inglese:', it:'Sto mangiando adesso.', a:'I am eating now.', acc:["I'm eating now."], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:'I am study English.', a:'I am studying English.', acc:["I'm studying English."], e:'serve la forma -ing.'}
  ]
},
{
  id:'a1-articles', t:'Articoli: a / an / the',
  g:`<p><b>a/an</b> = un/uno/una (articolo indeterminativo), solo con nomi singolari numerabili. Si usa <b>an</b> davanti a suono vocalico: <i>a car, an apple, an hour</i> (h muta), <i>a university</i> (suono /ju/).</p>
  <p><b>the</b> = il/lo/la/i/gli/le (determinativo), per cose specifiche o già note: <i>the sun, the book on the table</i>.</p>
  <p>Spesso <b>nessun articolo</b> con plurali generici e non numerabili: <i>I like dogs. Water is important.</i></p>
  <p>💡 <b>Regola del suono, non della lettera:</b> a/an dipende dal suono iniziale, non dalla scrittura: <i>an hour</i> (h muta, suono vocalico), ma <i>a university</i> (suono /ju/). Si usa <b>the</b> per cose uniche (the sun, the moon) e quando l'interlocutore sa già di cosa parli.</p>`,
  ex:[['I have a dog.','Ho un cane.'],['She is an architect.','Lei è un\'architetto.'],['Close the door, please.','Chiudi la porta, per favore.'],['I love music.','Amo la musica.']],
  qz:[
    {ty:'mc', q:'She is ___ engineer.', o:['a','an','the','-'], a:1, e:'suono vocalico → an.'},
    {ty:'mc', q:'Can you pass me ___ salt?', o:['a','an','the','-'], a:2, e:'sale specifico sul tavolo → the.'},
    {ty:'fill', q:'Inserisci a/an/the:', s:'I saw ___ interesting film yesterday.', a:'an', acc:[], e:'interesting inizia per vocale.'},
    {ty:'mc', q:'I like ___ (in generale).', o:['a cats','an cats','the cats','cats'], a:3, e:'plurale generico → nessun articolo.'},
    {ty:'tr', q:'Traduci in inglese:', it:'È un\'ora.', a:'It is an hour.', acc:["It's an hour."], e:'h muta → an.'},
    {ty:'corr', q:"Correggi l'errore:", w:'I bought a umbrella.', a:'I bought an umbrella.', acc:[], e:'vocale → an.'}
  ]
},
{
  id:'a1-plurals', t:'Plurale dei nomi',
  g:`<p>Regola base: <b>+s</b> (book → books). Nomi in -s, -ss, -sh, -ch, -x → <b>+es</b> (box → boxes). Nomi in consonante + y → <b>-ies</b> (city → cities). Nomi in -f/-fe → spesso <b>-ves</b> (knife → knives).</p>
  <p><b>Plurali irregolari</b> da memorizzare: man→men, woman→women, child→children, foot→feet, tooth→teeth, person→people, mouse→mice.</p>
  <p>💡 <b>Nomi sempre incontabili</b> (niente plurale, niente "a"): <i>information, advice, news, money, furniture, luggage</i>. Si dice <i>some information</i>, mai "informations". Inoltre <i>news</i> regge il verbo singolare: <i>the news <b>is</b> good</i>.</p>`,

{
  id:'a1-possessive', t:'Aggettivi possessivi e genitivo sassone',
  g:`<p>Aggettivi possessivi: <b>my, your, his, her, its, our, your, their</b>. Non cambiano col numero del nome: <i>my book, my books</i>.</p>
  <p>Il <b>genitivo sassone ('s)</b> indica possesso: <i>Anna's car</i> (l'auto di Anna). Con plurali che finiscono in -s si mette solo l'apostrofo: <i>my parents' house</i>.</p>
  <p>💡 <b>Non confondere its e it's:</b> <i>its</i> = possessivo (the dog wags <b>its</b> tail), <i>it's</i> = it is. Inoltre evita "the car of John": con le persone si preferisce sempre il genitivo sassone, <i>John's car</i>.</p>`,
  ex:[['This is my phone.','Questo è il mio telefono.'],['Her name is Sara.','Il suo nome è Sara.'],["Tom's bike is new.","La bici di Tom è nuova."],["the students' books","i libri degli studenti"]],

{
  id:'a1-thereis', t:'There is / There are',
  g:`<p>Si usa per dire che qualcosa <b>esiste o si trova</b> in un luogo. <b>There is</b> (+ singolare/non numerabile): <i>There is a book on the table.</i> <b>There are</b> (+ plurale): <i>There are three chairs.</i></p>

  <p>💡 <b>Non confondere con "it is":</b> <i>there is</i> indica esistenza ("c'è"), <i>it is</i> descrive ("è"). <i>There is a book on the table</i> (c'è un libro) ≠ <i>It is a book</i> (è un libro). Nelle liste l'inglese accorda il verbo col primo elemento: <i>There is a pen and two books</i>.</p>`,
  ex:[['There is a problem.','C\'è un problema.'],['There are many people.','Ci sono molte persone.'],['Is there a bank near here?','C\'è una banca qui vicino?'],["There aren't any eggs.",'Non ci sono uova.']],

{

  g:`<p><b>can</b> esprime <b>abilità</b> (so/sai fare) e <b>possibilità/permesso</b>: <i>I can swim. Can I open the window?</i></p>
  <p>È seguito dal <b>verbo base</b> senza "to" e non prende -s alla terza persona: <i>She can drive.</i> Negazione: <b>can't / cannot</b>. Domanda: <i>Can you...?</i></p>

{
  id:'a2-pastsimple', t:'Past Simple (passato semplice)',
  g:`<p>Si usa per <b>azioni concluse nel passato</b>, spesso con un tempo preciso (yesterday, last week, in 2019).</p>
  <p>Verbi regolari: <b>+ed</b> (work → worked, play → played, study → studied). Tanti verbi sono <b>irregolari</b> e vanno memorizzati (go → went, have → had, see → saw, take → took).</p>

{
  id:'a2-pastcont', t:'Past Continuous (passato progressivo)',
  g:`<p>Si forma con <b>was/were + verbo-ing</b> e descrive un'azione <b>in corso in un momento del passato</b>: <i>At 8 pm I was watching TV.</i></p>
  <p>Spesso si combina col past simple: l'azione lunga (continuous) viene <b>interrotta</b> da una breve (simple): <i>While I was cooking, the phone rang.</i></p>
  <p>💡 <b>Parole spia:</b> <i>while</i> introduce di solito l'azione lunga (past continuous), <i>when</i> spesso quella breve (past simple). Confronta: <i>When I arrived, she was cooking</i> (lei stava già cucinando) ≠ <i>When I arrived, she cooked</i> (ha cucinato dopo il mio arrivo).</p>`,

{
  id:'a2-presentperfect', t:'Present Perfect (have + participio)',
  g:`<p>Si forma con <b>have/has + past participle</b> (worked, gone, seen). Collega <b>passato e presente</b>: esperienze di vita, azioni recenti con effetto sull'ora, situazioni iniziate nel passato e ancora valide.</p>
  <p>Parole tipiche: <b>ever, never, just, already, yet, for, since</b>. <i>I have just finished. Have you ever been to London? She has lived here for ten years.</i></p>
  <p>Attenzione: con un tempo passato preciso (yesterday, last year) si usa il <b>past simple</b>, non il present perfect.</p>
  <p>💡 <b>just/already/yet:</b> <i>just</i> = appena (I've just arrived), <i>already</i> = già, in affermative (I've already eaten), <i>yet</i> = ancora/già, in negative e domande a fine frase (Have you finished yet? / Not yet). In italiano traduciamo spesso col passato prossimo, ma in inglese la scelta dipende dal legame col presente.</p>`,
  ex:[['I have finished my homework.','Ho finito i compiti.'],['Have you ever eaten sushi?','Hai mai mangiato sushi?'],['She has lived here since 2010.','Vive qui dal 2010.'],["He hasn't arrived yet.",'Non è ancora arrivato.']],

{
  id:'a2-comparatives', t:'Comparativi e superlativi',
  g:`<p>Aggettivi <b>corti</b> (1 sillaba): comparativo <b>-er + than</b>, superlativo <b>the -est</b> (cheap → cheaper → the cheapest). Con -y: happy → happier → the happiest.</p>
  <p>Aggettivi <b>lunghi</b> (2+ sillabe): <b>more ... than</b> / <b>the most ...</b> (expensive → more expensive → the most expensive).</p>
  <p>Irregolari: good → better → the best; bad → worse → the worst; far → further/farther → the furthest.</p>
  <p>💡 <b>Errore tipico:</b> non combinare mai "more" con "-er": si dice <i>cheaper</i>, non "more cheaper". Per dire "sempre più" si raddoppia: <i>bigger and bigger</i>, <i>more and more expensive</i>. E "del / della classe" si rende con <b>in</b>: <i>the tallest <b>in</b> the class</i> (non "of the class").</p>`,
  ex:[['This car is cheaper than that one.','Questa auto è più economica di quella.'],['She is the tallest in the class.','È la più alta della classe.'],['It is more difficult than I thought.','È più difficile di quanto pensassi.'],['Today is the best day.','Oggi è il giorno migliore.']],

{
  id:'a2-future', t:'Futuro: will / be going to',
  g:`<p><b>will + base</b>: decisioni prese sul momento, previsioni, promesse: <i>I'll help you. It will rain tomorrow.</i></p>
  <p><b>be going to + base</b>: intenzioni e piani già decisi, e previsioni basate su prove evidenti: <i>I'm going to study tonight. Look at those clouds — it's going to rain.</i></p>

  <p>💡 <b>In breve:</b> decisione sul momento → <b>will</b>; piano già deciso → <b>going to</b>; appuntamento in agenda → <b>present continuous</b>. Spesso più di una forma è accettabile; l'errore vero è mettere "to" dopo will (<i>I will <s>to</s> go</i> ❌).</p>`,

{
  id:'a2-conditionals01', t:'Condizionale zero e primo (0 & 1st)',
  g:`<p><b>Zero conditional</b>: verità generali. <i>If + present simple, present simple</i>: <i>If you heat ice, it melts.</i></p>
  <p><b>First conditional</b>: situazioni reali/probabili nel futuro. <i>If + present simple, will + base</i>: <i>If it rains, I'll stay home.</i></p>
  <p>Dopo <b>if</b> non si usa "will". Si può usare <b>when</b> per cose certe: <i>When I get home, I'll call you.</i></p>
  <p>💡 <b>if o when?</b> <i>when</i> = quando (è certo che accada), <i>if</i> = se (è solo possibile). La regola d'oro: dopo if/when riferiti al futuro va il <b>present simple</b>, mai il futuro. Errore tipico italiano: "If it will rain" ❌ → "If it rains" ✅.</p>`,

{
  id:'b1-pp-vs-past', t:'Present Perfect vs Past Simple',
  g:`<p>Il <b>past simple</b> indica un'azione finita in un tempo passato <b>definito</b> (yesterday, in 2010, two days ago). Il <b>present perfect</b> indica un legame col presente: tempo <b>non specificato</b>, esperienza, o periodo non ancora concluso (today, this week).</p>
  <p>Confronta: <i>I saw her yesterday</i> (quando preciso) vs <i>I have seen her recently</i> (quando indefinito).</p>
  <p>Con <b>for/since</b> e situazioni ancora in corso → present perfect: <i>I have worked here since 2018.</i></p>
  <p>💡 <b>Trappola dell'italiano:</b> noi usiamo il passato prossimo sia per "ho mangiato ieri" sia per "ho già mangiato", ma l'inglese distingue: con tempo definito (ieri) → past simple, con legame al presente → present perfect. Espressioni come <i>ago</i> impongono sempre il past simple.</p>`,
  ex:[['I lost my keys yesterday.','Ho perso le chiavi ieri.'],["I've lost my keys (I can't find them now).",'Ho perso le chiavi (non le trovo).'],['Did you call her this morning?','L\'hai chiamata stamattina?'],['Have you called her today?','L\'hai chiamata oggi?']],
  qz:[
    {ty:'mc', q:'I ___ to Japan in 2019.', o:['have been','went','have gone','go'], a:1, e:'tempo definito → past simple.'},
    {ty:'mc', q:'___ you ever ___ a famous person?', o:['Did / meet','Have / met','Have / meet','Did / met'], a:1, e:'esperienza → present perfect.'},
    {ty:'fill', q:'Completa:', s:'She ___ (live) in Rome for ten years (ancora ora).', a:'has lived', acc:["'s lived"], e:'situazione attuale → present perfect.'},
    {ty:'fill', q:'Completa:', s:'We ___ (watch) a great film last night.', a:'watched', acc:[], e:'last night → past simple.'},
    {ty:'tr', q:'Traduci in inglese:', it:'Vivo qui da tre anni.', a:'I have lived here for three years.', acc:["I've lived here for three years."], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:'I have finished the report two hours ago.', a:'I finished the report two hours ago.', acc:[], e:'"ago" → past simple.'}
  ]
},
{
  id:'b1-conditionals2', t:'Secondo condizionale (2nd conditional)',
  g:`<p>Per situazioni <b>irreali, improbabili o ipotetiche</b> nel presente/futuro. Struttura: <i>If + past simple, would + base</i>: <i>If I won the lottery, I would travel the world.</i></p>
  <p>Con il verbo "be" si usa spesso <b>were</b> per tutte le persone: <i>If I were you, I would apologize.</i></p>
  <p>💡 <b>1° o 2° condizionale?</b> Il primo (If + present, will) è per cose <b>probabili</b> (If it rains, I'll stay). Il secondo (If + past, would) è per cose <b>improbabili o immaginarie</b> (If I won the lottery...). Mai "would" dopo if.</p>`,
  ex:[['If I had more time, I would learn Spanish.','Se avessi più tempo, imparerei lo spagnolo.'],['If I were rich, I would help others.','Se fossi ricco, aiuterei gli altri.'],['What would you do if you lost your job?','Cosa faresti se perdessi il lavoro?'],["She'd come if you invited her.",'Verrebbe se la invitassi.']],
  qz:[
    {ty:'mc', q:'If I ___ you, I would accept the offer.', o:['am','was','were','be'], a:2, e:'2nd cond. con be → were.'},
    {ty:'mc', q:'If we had a car, we ___ travel more.', o:['will','would','can','would have'], a:1, e:'risultato ipotetico → would.'},
    {ty:'fill', q:'Completa:', s:'If I ___ (know) the answer, I would tell you.', a:'knew', acc:[], e:'dopo if → past simple.'},
    {ty:'fill', q:'Completa:', s:'If she had money, she ___ (buy) a house.', a:'would buy', acc:["'d buy"], e:'would + base.'},
    {ty:'tr', q:'Traduci in inglese:', it:'Se vincessi, comprerei una macchina.', a:'If I won, I would buy a car.', acc:["If I won, I'd buy a car."], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:'If I would have time, I would help.', a:'If I had time, I would help.', acc:[], e:'dopo if → past simple, non would.'}
  ]
},
{
  id:'b1-passive', t:'Passivo (present & past simple)',
  g:`<p>Il passivo sposta l'attenzione sull'<b>oggetto</b> dell'azione. Struttura: <b>be + past participle</b>. Present: <i>English is spoken here.</i> Past: <i>The house was built in 1990.</i></p>
  <p>Chi compie l'azione (l'agente) si introduce con <b>by</b>, se rilevante: <i>The book was written by Orwell.</i></p>
  <p>💡 <b>Quando usarlo:</b> il passivo è utile quando l'autore dell'azione è ignoto, ovvio o poco importante (<i>My car was stolen</i>). Ricorda che serve sempre il <b>participio passato</b> (stolen, written, made), non il past simple: "was stole" ❌ → "was stolen" ✅.</p>`,
  ex:[['Coffee is grown in Brazil.','Il caffè è coltivato in Brasile.'],['The window was broken yesterday.','La finestra è stata rotta ieri.'],['These cars are made in Italy.','Queste auto sono fatte in Italia.'],['The letter was sent last week.','La lettera è stata spedita la settimana scorsa.']],
  qz:[
    {ty:'mc', q:'This bridge ___ in 1930.', o:['built','was built','is built','has built'], a:1, e:'passato passivo → was built.'},
    {ty:'mc', q:'English ___ all over the world.', o:['speaks','is speaking','is spoken','spoken'], a:2, e:'present passive → is spoken.'},
    {ty:'fill', q:'Trasforma al passivo:', s:'Millions of people ___ (visit) this museum every year.', a:'visit', acc:[], e:'attivo qui; passivo: is visited by...'},
    {ty:'fill', q:'Completa (passivo passato):', s:'The cake ___ (eat) by the children.', a:'was eaten', acc:[], e:'be + participio.'},
    {ty:'tr', q:'Traduci in inglese (passivo):', it:'Il libro è stato scritto da Orwell.', a:'The book was written by Orwell.', acc:[], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:'The car was stole last night.', a:'The car was stolen last night.', acc:[], e:'serve il participio: stolen.'}
  ]
},
{
  id:'b1-reported', t:'Discorso indiretto (Reported Speech)',
  g:`<p>Si riferisce ciò che qualcuno ha detto. Di solito i tempi <b>retrocedono</b> di un passo (backshift): present → past, past → past perfect, will → would, can → could.</p>
  <p>Cambiano anche pronomi ed espressioni di tempo: <i>now → then, today → that day, tomorrow → the next day</i>. Es.: "I am tired" → <i>She said (that) she was tired.</i></p>
  <p>Domande riportate: si usa l'ordine affermativo: "Where do you live?" → <i>He asked where I lived.</i></p>
  <p>💡 <b>Errore tipico:</b> nelle domande indirette niente "do/does/did" e niente punto interrogativo: <i>He asked where I <b>lived</b></i> (non "where did I live"). Per le domande sì/no si usa <b>if/whether</b>: "Are you ok?" → <i>She asked if I was ok.</i></p>`,
  ex:[['"I\'m busy" → He said he was busy.','"Sono occupato" → Disse che era occupato.'],['"I\'ll call you" → She said she would call me.','"Ti chiamerò" → Disse che mi avrebbe chiamato.'],['"Do you like it?" → He asked if I liked it.','"Ti piace?" → Mi chiese se mi piacesse.'],['"I saw him" → She said she had seen him.','"L\'ho visto" → Disse che lo aveva visto.']],
  qz:[
    {ty:'mc', q:'"I am tired." → She said she ___ tired.', o:['is','was','were','has been'], a:1, e:'present → past.'},
    {ty:'mc', q:'"I will help." → He said he ___ help.', o:['will','would','can','had'], a:1, e:'will → would.'},
    {ty:'fill', q:'Riporta:', s:'"I live in Rome." → He said he ___ in Rome.', a:'lived', acc:[], e:'present → past.'},
    {ty:'fill', q:'Domanda riportata:', s:'"Where are you?" → She asked where I ___ .', a:'was', acc:[], e:'ordine affermativo + backshift.'},
    {ty:'tr', q:'Riporta in inglese:', it:'Disse che era stanca.', a:'She said she was tired.', acc:['She said that she was tired.'], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:'He asked where do I live.', a:'He asked where I lived.', acc:[], e:'domanda indiretta → ordine affermativo.'}
  ]
},
{
  id:'b1-modals-obligation', t:'Modali di obbligo e consiglio',
  g:`<p><b>must</b> = obbligo forte (spesso interno): <i>I must finish this.</i> <b>have to</b> = obbligo esterno/regola: <i>You have to wear a helmet.</i></p>
  <p><b>mustn't</b> = divieto (non devi/è vietato). <b>don't have to</b> = non è necessario (manca l'obbligo). Attenzione: significati diversi!</p>
  <p><b>should / ought to</b> = consiglio: <i>You should rest.</i></p>
  <p>💡 <b>Coppia insidiosa:</b> <i>mustn't</i> (è vietato) ≠ <i>don't have to</i> (non è necessario). "You mustn't park here" = divieto; "You don't have to park here" = puoi anche non farlo. Confonderle cambia completamente il senso.</p>`,
  ex:[['You must stop at the red light.','Devi fermarti col rosso.'],['You have to show your ID.','Devi mostrare il documento.'],["You mustn't smoke here.",'Non devi fumare qui (vietato).'],["You don't have to come.",'Non sei obbligato a venire.']],
  qz:[
    {ty:'mc', q:'Vietato: You ___ park here.', o:["don't have to","mustn't","should","have to"], a:1, e:'divieto → mustn\'t.'},
    {ty:'mc', q:'Non necessario: You ___ pay, it\'s free.', o:["mustn't","don't have to","must","should"], a:1, e:'assenza di obbligo → don\'t have to.'},
    {ty:'fill', q:'Consiglio:', s:'You ___ see a doctor.', a:'should', acc:['ought to'], e:'consiglio → should.'},
    {ty:'fill', q:'Obbligo esterno (regola):', s:'At work we ___ wear a uniform.', a:'have to', acc:['must'], e:'regola → have to.'},
    {ty:'tr', q:'Traduci in inglese:', it:'Non devi fumare qui (è vietato).', a:"You mustn't smoke here.", acc:['You must not smoke here.'], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:"You don't must do it.", a:"You mustn't do it.", acc:["You don't have to do it."], e:'forma errata di must.'}
  ]
},
{
  id:'b1-relative', t:'Pronomi relativi (who, which, that, where)',
  g:`<p><b>who</b> per persone, <b>which</b> per cose, <b>that</b> per entrambi (informale), <b>where</b> per luoghi, <b>whose</b> per possesso.</p>
  <p>Frasi relative <b>determinative</b> (essenziali) senza virgole: <i>The man who called is my boss.</i> Frasi <b>non determinative</b> (informazione extra) tra virgole, non si usa "that": <i>My brother, who lives in Rome, is a doctor.</i></p>
  <p>💡 <b>Differenza dall'italiano:</b> in inglese, quando il relativo è complemento oggetto, si può <b>omettere</b>: <i>The book (that) I read</i>. Inoltre la preposizione spesso va a fine frase: <i>the man (who) I spoke to</i>, non "the man to who I spoke" (forma formale: to whom).</p>`,
  ex:[['The book that I read was great.','Il libro che ho letto era ottimo.'],['She is the woman who helped me.','È la donna che mi ha aiutato.'],['This is the house where I grew up.','Questa è la casa dove sono cresciuto.'],['He has a friend whose car is red.','Ha un amico la cui auto è rossa.']],
  qz:[
    {ty:'mc', q:'The man ___ lives next door is friendly.', o:['which','who','where','whose'], a:1, e:'persona → who.'},
    {ty:'mc', q:'This is the restaurant ___ we met.', o:['which','who','where','that'], a:2, e:'luogo → where.'},
    {ty:'fill', q:'Completa:', s:'I have a friend ___ brother is a pilot.', a:'whose', acc:[], e:'possesso → whose.'},
    {ty:'fill', q:'Completa (cosa):', s:'The car ___ I bought is fast.', a:'that', acc:['which'], e:'cosa → that/which.'},
    {ty:'tr', q:'Traduci in inglese:', it:'La donna che mi ha chiamato è mia zia.', a:'The woman who called me is my aunt.', acc:['The woman that called me is my aunt.'], e:''},
    {ty:'corr', q:"Correggi l'errore:", w:'The phone who I bought is new.', a:'The phone that I bought is new.', acc:['The phone which I bought is new.'], e:'cosa → that/which.'}
  ]
},
{
  id:'b1-gerinf', t:'Gerundio o infinito (-ing / to)',
  g:`<p>Alcuni verbi vogliono il <b>gerundio</b> (-ing): <i>enjoy, finish, avoid, suggest, mind, keep</i>. Es.: <i>I enjoy reading.</i></p>
  <p>Altri vogliono l'<b>infinito con to</b>: <i>want, decide, hope, promise, need, would like</i>. Es.: <i>I want to go.</i></p>
  <p>Dopo le <b>preposizioni</b> sempre -ing: <i>good at cooking, interested in learning.</i></p>
  <p>💡 <b>Da ricordare:</b> dopo i verbi modali (can, must, will...) si usa la forma base senza to (I can <s>to</s> swim ❌). Alcuni verbi reggono entrambe le forme con poca differenza (start, like, begin), altri cambiano significato (vedi l'argomento dedicato a B2).</p>`,
  ex:[['I enjoy swimming.','Mi piace nuotare.'],['She decided to leave.','Decise di andarsene.'],['He is good at drawing.','È bravo a disegnare.'],['They want to travel.','Vogliono viaggiare.']],
  qz:[

    {ty:'mc', q:'She wants ___ a doctor.', o:['become','becoming','to become','becomes'], a:2, e:'want + to.'},
    {ty:'fill', q:'Completa:', s:"They're interested in ___ (learn) Italian.", a:'learning', acc:[], e:'dopo preposizione → -ing.'},
    {ty:'fill', q:'Completa:', s:'I promised ___ (help) him.', a:'to help', acc:[], e:'promise + to.'},
    {ty:'tr', q:'Traduci in inglese:', it:'Ho finito di lavorare.', a:'I finished working.', acc:[], e:'finish + -ing.'},
    {ty:'corr', q:"Correggi l'errore:", w:'I want going home.', a:'I want to go home.', acc:[], e:'want + to.'}
  ]
}
];

{
  id:'b2-narrative', t:'Narrative tenses (past perfect & continuous)',
  g:`<p>Per raccontare al passato si combinano: <b>past simple</b> (eventi principali), <b>past continuous</b> (sfondo in corso), <b>past perfect</b> (azione precedente: had + participio), <b>past perfect continuous</b> (durata fino a un punto: had been + -ing).</p>
  <p>Es.: <i>When I arrived, the meeting had already started. I was tired because I had been working all day.</i></p>
  <p>💡 <b>A cosa serve il past perfect:</b> a chiarire che un evento è avvenuto <b>prima</b> di un altro momento passato. Senza di esso l'ordine può essere ambiguo: <i>When I arrived, she left</i> (se ne andò dopo) vs <i>When I arrived, she had left</i> (era già andata via).</p>`,

{
  id:'b2-conditionals3', t:'Terzo condizionale e condizionali misti',
  g:`<p><b>Third conditional</b>: situazioni irreali del <b>passato</b> (rimpianti). <i>If + past perfect, would have + participio</i>: <i>If I had studied, I would have passed.</i></p>
  <p><b>Mixed conditionals</b>: condizione passata → risultato presente (<i>If I had taken that job, I would be rich now</i>), oppure condizione presente → risultato passato.</p>
  <p>💡 <b>Schema rapido:</b> 3° condizionale = <i>If + had + participio, would have + participio</i>. Errore tipico italiano: mettere "would have" anche dopo if. La parte con if non prende mai would: "If I had known" ✅, non "If I would have known" ❌.</p>`,
  ex:[["If you had told me, I would have helped.",'Se me l\'avessi detto, ti avrei aiutato.'],["She wouldn't have missed the train if she had left earlier.",'Non avrebbe perso il treno se fosse uscita prima.'],['If I were taller, I would have become a model.','Se fossi più alto, sarei diventato un modello.'],["If they had saved money, they'd own a house now.",'Se avessero risparmiato, ora avrebbero una casa.']],

{
  id:'b2-modals-deduction', t:'Modali di deduzione (must/can\'t/might have)',
  g:`<p>Per dedurre il <b>presente</b>: <b>must</b> (sicuro di sì), <b>can't</b> (sicuro di no), <b>might/may/could</b> (forse). <i>He must be tired. She can't be serious. It might rain.</i></p>
  <p>Per il <b>passato</b>: <b>must have / can't have / might have + participio</b>: <i>He must have forgotten. She can't have seen us. They might have left.</i></p>
  <p>💡 <b>Attenzione alla forma:</b> dopo il modale serve <b>have + participio</b> (must have <b>gone</b>), non "must has" né "must had". Nel parlato "have" suona come "of", ma in scrittura è sempre <i>have</i>: "must of" ❌.</p>`,
  ex:[['You must be joking!','Stai sicuramente scherzando!'],["He can't have finished already.",'Non può aver già finito.'],['She might have missed the bus.','Forse ha perso l\'autobus.'],["They must have known.",'Devono averlo saputo.']],

{
  id:'b2-future-forms', t:'Future Continuous & Future Perfect',
  g:`<p><b>Future continuous</b> (will be + -ing): azione in corso in un momento futuro: <i>This time tomorrow I'll be flying to Rome.</i></p>
  <p><b>Future perfect</b> (will have + participio): azione che sarà completata entro un certo momento: <i>By 2030 they will have finished the project.</i></p>
  <p><b>Future perfect continuous</b> (will have been + -ing): durata fino a un punto futuro: <i>By June I'll have been working here for ten years.</i></p>
  <p>💡 <b>Parole spia:</b> il future continuous spesso accompagna "this time tomorrow / at 8 pm"; il future perfect accompagna "by + tempo" (by Friday, by the time...) e indica qualcosa di completato entro quel momento.</p>`,
  ex:[["At 8 pm I'll be having dinner.",'Alle 20 starò cenando.'],['By Friday I will have finished.','Entro venerdì avrò finito.'],["Next year we'll have been married for 20 years.",'L\'anno prossimo saremo sposati da 20 anni.'],["Don't call at 9 — I'll be sleeping.",'Non chiamare alle 9 — starò dormendo.']],

{
  id:'b2-wish', t:'Wish / If only',
  g:`<p><b>wish + past simple</b>: desideri sul presente (irreale): <i>I wish I had more time.</i></p>
  <p><b>wish + past perfect</b>: rimpianti sul passato: <i>I wish I had studied harder.</i></p>
  <p><b>wish + would</b>: fastidio per abitudini altrui o desiderio di cambiamento: <i>I wish you would stop smoking.</i> <b>If only</b> è un'alternativa più enfatica.</p>
  <p>💡 <b>Logica del tempo "all'indietro":</b> come nei condizionali irreali, "wish" usa un tempo arretrato di un passo rispetto al senso: presente irreale → past simple (I wish I had...), passato → past perfect (I wish I had had...). Non si usa "wish + would" per i propri desideri (I wish I would... ❌).</p>`,
  ex:[['I wish I were taller.','Vorrei essere più alto.'],['I wish I had known.','Vorrei averlo saputo.'],['I wish it would stop raining.','Vorrei che smettesse di piovere.'],['If only I had more money.','Se solo avessi più soldi.']],

{
  id:'b2-relative-clauses', t:'Relative clauses (defining & non-defining)',
  g:`<p>Le <b>defining</b> danno informazione essenziale, niente virgole, "that" possibile, il pronome può essere omesso se è oggetto: <i>The book (that) I read...</i></p>
  <p>Le <b>non-defining</b> aggiungono info extra, tra virgole, niente "that", pronome non omettibile: <i>My boss, who is from Spain, speaks four languages.</i></p>
  <p>Si possono usare anche con <b>preposizione</b> in stile formale: <i>the colleague to whom I spoke.</i></p>
  <p>💡 <b>Regola delle virgole:</b> se togliendo la frase relativa la frase principale perde un'informazione essenziale → niente virgole (defining). Se è solo un'aggiunta → virgole (non-defining). Nelle non-defining non si usa mai "that".</p>`,
  ex:[['The woman who lives here is a vet.','La donna che abita qui è veterinaria.'],['Paris, which is the capital of France, is beautiful.','Parigi, che è la capitale della Francia, è bellissima.'],['The film (that) we saw was boring.','Il film che abbiamo visto era noioso.'],['This is the reason why he left.','Questo è il motivo per cui se n\'è andato.']],

{
  id:'b2-phrasal', t:'Phrasal verbs (estesi)',
  g:`<p>I <b>phrasal verbs</b> sono verbo + particella (avverbio/preposizione) con significato spesso idiomatico: <i>give up</i> (rinunciare), <i>look after</i> (prendersi cura), <i>put off</i> (rimandare), <i>get on with</i> (andare d'accordo).</p>
  <p>Alcuni sono <b>separabili</b> (turn the light off / turn off the light), altri <b>inseparabili</b> (look after the kids). Con i pronomi i separabili devono dividersi: <i>turn it off</i> (non "turn off it").</p>
  <p>💡 <b>Consiglio di studio:</b> i phrasal verbs sono uno dei tratti più "nativi" dell'inglese e raramente si traducono parola per parola. Conviene impararli a piccoli gruppi per tema (al lavoro, viaggi...) con una frase d'esempio, più che in liste isolate.</p>`,

  id:'c1-inversion', t:'Inversione con avverbi negativi',
  g:`<p>In stile formale/enfatico, avverbi e locuzioni negative a inizio frase provocano l'<b>inversione</b> soggetto-ausiliare (come in una domanda): <i>Never have I seen such a mess. Not only did he lie, but he also...</i></p>

  <p>💡 <b>Quando usarla:</b> l'inversione è un tratto formale/letterario o retorico, da non abusare nel parlato quotidiano. Funziona come una domanda: ausiliare prima del soggetto (<i>Never <b>have I</b></i>). Se non c'è ausiliare, si introduce do/does/did (<i>Rarely <b>do we</b> see...</i>).</p>`,

{
  id:'c1-cleft', t:'Cleft sentences (frasi scisse)',
  g:`<p>Le cleft sentences mettono in <b>risalto</b> un elemento. <b>It-cleft</b>: <i>It was John who broke it.</i> <b>Wh-cleft</b>: <i>What I need is a holiday. What he did was (to) call the police.</i></p>

{
  id:'c1-participle', t:'Participle clauses (frasi participiali)',
  g:`<p>Si usano per rendere la frase più <b>concisa e formale</b>, sostituendo frasi relative o subordinate. Participio presente (-ing) per voce attiva/contemporaneità: <i>Feeling tired, she went to bed.</i> Participio passato per significato passivo: <i>Built in 1900, the house is now protected.</i></p>
  <p>Perfect participle per anteriorità: <i>Having finished, he left.</i></p>
  <p>💡 <b>Soggetto coerente:</b> il soggetto della participle clause dev'essere lo stesso della principale, altrimenti si crea un "dangling participle" (errore di stile): <i>Walking home, the rain started</i> ❌ (non è la pioggia a camminare). Forma negativa: <i>Not knowing...</i></p>`,

{
  id:'c1-linking', t:'Connettivi sofisticati e discourse markers',
  g:`<p>A livello avanzato si padroneggiano connettivi formali: <b>nevertheless, nonetheless, whereas, albeit, hence, thereby, notwithstanding, provided that, insofar as, despite/in spite of + -ing.</b></p>
  <p>Attenzione alla struttura: <i>despite/in spite of + nome/-ing</i> (no "of that"), <i>although/though + frase</i>: <i>Despite being tired... / Although he was tired...</i></p>

  ex:[['He failed; nevertheless, he kept trying.','Fallì; ciononostante, continuò a provare.'],['She likes tea, whereas he prefers coffee.','A lei piace il tè, mentre lui preferisce il caffè.'],['Despite the rain, we went out.','Nonostante la pioggia, uscimmo.'],['It was a good, albeit short, holiday.','Fu una bella vacanza, anche se breve.']],

{
  id:'c2-idioms', t:'Espressioni idiomatiche e collocations',
  g:`<p>A livello di padronanza si usano con naturalezza idiomi e collocations native. Es.: <i>to bite the bullet</i> (affrontare il difficile), <i>once in a blue moon</i> (rarissimamente), <i>the bottom line</i> (il punto chiave), <i>a blessing in disguise</i> (un male che si rivela un bene).</p>
  <p>Le <b>collocations</b> sono abbinamenti naturali: <i>make a decision, do research, heavy rain, strong coffee, take responsibility.</i></p>
  <p>💡 <b>Perché contano:</b> a livello C2 la fluência passa dalle collocations: dire "do a decision" o "strong rain" è grammaticalmente comprensibile ma suona innaturale. Conviene annotare le parole non da sole, ma negli abbinamenti in cui ricorrono.</p>`,

{
  id:'c2-nuance', t:'Sfumature: registro e connotazione',
  g:`<p>La padronanza implica scegliere la parola giusta per <b>registro</b> (formale/informale) e <b>connotazione</b> (positiva/negativa). Es.: <i>thrifty</i> (positivo) vs <i>stingy</i> (negativo) per "parsimonioso"; <i>assertive</i> vs <i>aggressive</i>; <i>childlike</i> vs <i>childish</i>.</p>

  <p>💡 <b>Adatta il registro al contesto:</b> usare termini formali in una chat tra amici suona ironico o pomposo; usare slang in una relazione professionale suona sciatto. La padronanza è scegliere consapevolmente, non usare sempre il vocabolo più "difficile".</p>`,

{
  id:'c2-subjunctive', t:'Congiuntivo e strutture formali',
  g:`<p>Il congiuntivo inglese (subjunctive) appare in contesti formali dopo verbi di richiesta/proposta: <i>I suggest that he <b>be</b> informed. They demanded that she <b>resign</b>.</i> (forma base, senza -s).</p>
  <p>Espressioni fisse: <i>Be that as it may, Suffice it to say, If need be, Come what may, Long live the King.</i></p>
  <p>💡 <b>Differenza UK/US:</b> il subjunctive ("I suggest that he be informed") è più sistematico nell'inglese americano; quello britannico spesso preferisce "should" ("I suggest that he should be informed"). Entrambi corretti, ma coerenti col registro formale.</p>`,

{
  id:'c2-hedging', t:'Hedging e linguaggio sfumato',
  g:`<p>Nello stile accademico/professionale si <b>attenua</b> l'affermazione (hedging) per cautela e cortesia: <i>It would appear that..., This may suggest that..., There is a tendency for..., to some extent, arguably.</i></p>
  <p>Permette di esprimere opinioni in modo misurato e di evitare generalizzazioni assolute.</p>
  <p>💡 <b>Equilibrio:</b> l'hedging dà cautela e cortesia, ma esagerare rende il testo vago e poco convincente. La buona scrittura accademica alterna affermazioni misurate ad altre più dirette quando le prove lo permettono.</p>`,
  ex:[['It would appear that costs have risen.','Sembrerebbe che i costi siano aumentati.'],['This may suggest a link.','Ciò potrebbe suggerire un legame.'],['Arguably, it is the best option.','Probabilmente è l\'opzione migliore.'],['To some extent, I agree.','In una certa misura, sono d\'accordo.']],

(function(){

  {
    id:'b1-ppc', t:'Present Perfect Continuous',
    g:`<p>Si forma con <b>have/has been + verbo-ing</b> e mette l'accento sulla <b>durata</b> di un'azione iniziata nel passato e ancora in corso (o appena conclusa): <i>I have been working all morning.</i></p>
    <p>Differenza chiave col present perfect semplice: il <b>continuous</b> sottolinea l'attività e quanto dura (<i>I've been reading for two hours</i> → conta il tempo passato a leggere), mentre il <b>simple</b> sottolinea il risultato o la quantità (<i>I've read three books</i> → conta i libri finiti).</p>
    <p>Si usa spesso con <b>for, since, how long, all day, lately, recently</b>. Attenzione: i verbi di stato (know, like, be, have=possedere) di norma <b>non</b> prendono questa forma.</p>`,
    ex:[["I've been studying English for years.",'Studio inglese da anni.'],['She has been waiting since 9 am.','Aspetta dalle 9.'],['How long have you been living here?','Da quanto vivi qui?'],["It's been raining all day.",'Ha piovuto tutto il giorno.']],
    qz:[
      {ty:'mc', q:'My eyes hurt. I ___ at the screen all day.', o:['have looked','have been looking','look','am looking'], a:1, e:'durata di attività → present perfect continuous.'},
      {ty:'mc', q:"I've ___ three cups of coffee today.", o:['been drinking','drunk','drink','drinking'], a:1, e:'quantità/risultato → simple (drunk).'},
      {ty:'fill', q:'Completa:', s:'They ___ (work) here since 2018.', a:'have been working', acc:["'ve been working"], e:'since + durata → ppc.'},
      {ty:'fill', q:'Completa:', s:'How long ___ you ___ (learn) Italian?', a:'have been learning', acc:[], e:'How long → ppc.'},

      {ty:'mc', q:'Quale verbo NON va al continuous?', o:['work','wait','know','study'], a:2, e:'know è verbo di stato.'},
      {ty:'tr', q:'Traduci in inglese:', it:'Lavoro qui da tre mesi.', a:'I have been working here for three months.', acc:["I've been working here for three months."], e:''},

  {
    id:'b1-asas', t:'Comparazioni con (not) as ... as',
    g:`<p>Per dire che due cose sono <b>uguali</b> si usa <b>as + aggettivo + as</b>: <i>She is as tall as her brother.</i></p>
    <p>Per dire che sono <b>diverse</b> si usa <b>not as/so + aggettivo + as</b>: <i>This film isn't as good as the book.</i> Equivale a "meno ... di".</p>
    <p>Si possono aggiungere quantificatori: <i>almost as big as, twice as expensive as, not nearly as difficult as</i>. Con i nomi si usa <i>as much/many ... as</i>: <i>I don't have as much time as you.</i></p>`,

      {ty:'fill', q:'Completa:', s:'He runs almost ___ fast ___ a professional.', a:'as as', acc:[], e:'almost as ... as.'},
      {ty:'tr', q:'Traduci in inglese:', it:'È alta quanto me.', a:'She is as tall as me.', acc:['She is as tall as I am.'], e:''},

  {
    id:'b1-futuretime', t:'Future time clauses (when, as soon as, until)',
    g:`<p>Nelle frasi che parlano del futuro introdotte da <b>when, as soon as, until, before, after, once, by the time</b> si usa il <b>present simple</b>, NON il futuro, anche se il senso è futuro.</p>
    <p>La frase principale invece va al futuro (will/going to) o all'imperativo: <i>I'll call you when I arrive. As soon as it stops raining, we'll go out. Wait here until I come back.</i></p>

      {ty:'fill', q:'Completa:', s:'By the time we ___ (arrive), the show will have started.', a:'arrive', acc:[], e:'by the time + present.'},
      {ty:'mc', q:'Quale parola NON regge il present simple per il futuro?', o:['when','as soon as','until','because'], a:3, e:'because non è temporale (qui).'},
      {ty:'tr', q:'Traduci in inglese:', it:'Ti chiamo quando arrivo.', a:'I will call you when I arrive.', acc:["I'll call you when I arrive."], e:''},
      {ty:'tr', q:'Traduci in inglese:', it:'Aspetta finché torno.', a:'Wait until I come back.', acc:[], e:''},

    g:`<p>Si usa quando <b>qualcun altro</b> fa qualcosa <b>per noi</b> (un servizio). Struttura: <b>have/get + oggetto + participio passato</b>: <i>I had my car repaired</i> (= un meccanico me l'ha riparata, non l'ho fatto io).</p>

  {
    id:'b2-gerinf-meaning', t:'Gerundio o infinito? (con cambio di significato)',
    g:`<p>Alcuni verbi cambiano <b>significato</b> a seconda che siano seguiti da -ing o da to.</p>
    <p><b>stop</b>: <i>stop smoking</i> (smettere di fumare) vs <i>stop to smoke</i> (fermarsi per fumare). <b>remember/forget</b>: <i>remember locking</i> (ricordare di aver chiuso) vs <i>remember to lock</i> (ricordarsi di chiudere). <b>try</b>: <i>try doing</i> (provare/sperimentare) vs <i>try to do</i> (sforzarsi di). <b>regret</b>: <i>regret telling</i> (pentirsi di aver detto) vs <i>regret to tell</i> (dispiacersi di dover dire).</p>
    <p>In generale: <b>-ing</b> guarda a un'azione già avvenuta o all'attività in sé; <b>to</b> guarda a uno scopo o a qualcosa nel futuro.</p>`,
    ex:[['He stopped smoking.','Ha smesso di fumare.'],['He stopped to smoke.','Si è fermato per fumare.'],['Remember to call her.','Ricordati di chiamarla.'],['I remember meeting him.','Ricordo di averlo incontrato.']],
    qz:[

      {ty:'mc', q:'"Mi pento di averlo detto":', o:['I regret to say it','I regret saying it','I regret say it','I regret said it'], a:1, e:'pentirsi → -ing.'},
      {ty:'tr', q:'Traduci in inglese:', it:'Ricordati di spedire la lettera.', a:'Remember to send the letter.', acc:[], e:''},
      {ty:'tr', q:'Traduci in inglese:', it:'Ha smesso di bere.', a:'He stopped drinking.', acc:['She stopped drinking.'], e:''},
      {ty:'corr', q:"Correggi l'errore:", w:'He stopped to smoke years ago (= smise).', a:'He stopped smoking years ago.', acc:[], e:'smettere di → -ing.'}
    ]

  {
    id:'b2-contrast', t:'Connettivi di contrasto: although / despite / however',
    g:`<p>Tutti esprimono contrasto ma hanno strutture diverse, ed è un errore frequente confonderle.</p>
    <p><b>although / even though / though + frase</b> (soggetto + verbo): <i>Although it was raining, we went out.</i></p>
    <p><b>despite / in spite of + nome o -ing</b> (NO "of" dopo despite, NO frase con verbo coniugato): <i>Despite the rain... / Despite being tired...</i></p>
    <p><b>however / nevertheless</b> sono avverbi che collegano due frasi separate, di solito dopo punto o punto e virgola: <i>It was expensive; however, we bought it.</i></p>`,
    ex:[['Although he was tired, he kept going.','Anche se era stanco, continuò.'],['Despite the cost, they agreed.','Nonostante il costo, accettarono.'],["In spite of being late, she was calm.",'Nonostante il ritardo, era calma.'],['The plan was risky; however, it worked.','Il piano era rischioso; tuttavia funzionò.']],

    g:`<p>Per <b>enfatizzare</b> un'affermazione si inserisce l'ausiliare <b>do/does/did</b> davanti al verbo base, anche dove normalmente non servirebbe: <i>I do like it!</i> (mi piace davvero), <i>She does work hard.</i>, <i>He did call you</i> (ti ha chiamato eccome).</p>

  {
    id:'c1-reporting-passive', t:'Passivi di reporting (It is said that...)',
    g:`<p>Strutture formali per riferire opinioni o voci senza dire chi le sostiene, tipiche di notizie e testi accademici. Due schemi:</p>
    <p><b>It + be + participio + that-clause</b>: <i>It is said that he is very rich. It was believed that the earth was flat.</i></p>

    <p>Verbi comuni: <b>say, believe, think, know, report, expect, consider, claim</b>.</p>`,

(function(){

    id:'c2-fronting', t:'Fronting ed enfasi (so/such ... that)',
    g:`<p>Il <b>fronting</b> sposta a inizio frase un elemento per enfasi, spesso con inversione. Con un complemento o avverbio in apertura: <i>Down the road came a parade. Such was his anger that he left.</i></p>

    g:`<p>La <b>nominalizzazione</b> trasforma verbi e aggettivi in <b>sostantivi</b>, rendendo il testo più formale, denso e impersonale, tipico di contesti accademici e professionali.</p>
    <p>Es.: <i>They decided quickly</i> → <i>Their quick decision...</i>; <i>The prices increased</i> → <i>The increase in prices...</i>; <i>He is reluctant</i> → <i>His reluctance...</i></p>

  {c:'errore', t:'"People" è plurale', b:'<b>People</b> regge il verbo al plurale: <i>People <b>are</b> kind</i>, non "people is". Per "una persona" usa <b>a person</b>.'},
  {c:'errore', t:'"Fun" e "funny" non sono uguali', b:'<b>fun</b> = divertente nel senso di piacevole (a fun day). <b>funny</b> = buffo, che fa ridere (a funny joke). Attento a non confonderli.'},

  {c:'confondere', t:'"say" vs "tell"', b:'<b>tell</b> vuole la persona: <i>tell <b>me</b> a story</i>. <b>say</b> di solito no: <i>say something</i> (say to me, non "say me").'},
  {c:'errore', t:'"I am agree" è sbagliato', b:'"Essere d\'accordo" è il verbo <b>agree</b>, non "be agree": <i>I <b>agree</b> with you</i>.'},
  {c:'falso', t:'"Sensible" ≠ "sensibile"', b:'<b>sensible</b> = assennato, ragionevole. "Sensibile" (emotivo) è <b>sensitive</b>.'},

B1: [
  {c:'confondere', t:'Present perfect vs past simple', b:'Con un tempo passato preciso (yesterday, in 2010, ago) → <b>past simple</b>. Con tempo indefinito o legame col presente (ever, just, yet, for/since) → <b>present perfect</b>. <i>I saw him yesterday</i> / <i>I have seen him recently</i>.'},
  {c:'errore', t:'Dopo "if" niente "will"', b:'Nel primo condizionale: <i>If it <b>rains</b>, I will stay</i>, non "if it will rain". Stesso dopo when/as soon as/until quando parli del futuro.'},
  {c:'falso', t:'"Argument" spesso è "litigio"', b:'<b>argument</b> = discussione/litigio, oltre che "argomentazione". "Argomento (tema)" si dice <b>topic</b> o <b>subject</b>.'},

  {c:'falso', t:'"Actually/Eventually/Estate"', b:'Trappole classiche: <b>actually</b>=in realtà, <b>eventually</b>=alla fine, <b>estate</b>=patrimonio/proprietà (l\'estate stagione è <b>summer</b>).'},
  {c:'confondere', t:'"too" / "also" / "as well"', b:'Significano "anche". <b>also</b> di solito a metà frase (I also like tea), <b>too</b> e <b>as well</b> a fine frase (I like tea too / as well).'}
],
B2: [
  {c:'confondere', t:'"despite" vs "although"', b:'<b>despite/in spite of</b> + nome o -ing (despite the rain, despite being late). <b>although/even though</b> + frase con soggetto e verbo (although it was raining). Errore tipico: "despite of".'},
  {c:'errore', t:'Mai "would" dopo "if"', b:'Nel secondo/terzo condizionale il "would" sta nella principale, non dopo if: <i>If I <b>had</b> money, I would travel</i> (non "if I would have").'},
  {c:'falso', t:'"Comprehensive" ≠ "comprensivo"', b:'<b>comprehensive</b> = completo, esauriente (a comprehensive report). "Comprensivo (di persona)" = <b>understanding</b>.'},
  {c:'falso', t:'"Actual" / "Confront" / "Pretend"', b:'<b>actual</b>=effettivo/reale (non "attuale"), <b>confront</b>=affrontare/sfidare (non "confrontare" = compare), <b>pretend</b>=fingere (non "pretendere" = demand/expect).'},
  {c:'confondere', t:'Gerundio o infinito con cambio di senso', b:'<i>stop smoking</i> (smettere) ≠ <i>stop to smoke</i> (fermarsi per); <i>remember to lock</i> (compito futuro) ≠ <i>remember locking</i> (ricordo passato).'},
  {c:'errore', t:'"information/advice/news" sono incontabili', b:'Non hanno plurale e non vogliono "a": <i>some <b>information</b></i>, <i>a piece of advice</i>, <i>the news <b>is</b> good</i>. Mai "informations" o "advices".'},
  {c:'confondere', t:'Passato del causative', b:'<i>I had my car repaired</i> (me l\'hanno riparata) ≠ <i>I had repaired my car</i> (past perfect, l\'avevo riparata io). L\'ordine cambia tutto.'},
  {c:'falso', t:'"Eventually" e "actually" di nuovo', b:'Restano i falsi amici più insidiosi anche a B2 nei testi formali: ricontrolla sempre <b>actually</b> (=in realtà) e <b>eventually</b> (=alla fine).'}

C1: [
  {c:'errore', t:'Inversione completa con avverbi negativi', b:'Dopo Never/Rarely/Not only/Hardly a inizio frase serve l\'inversione come in una domanda: <i>Never <b>have I</b> seen...</i>, non "Never I have seen". L\'ausiliare precede il soggetto.'},
  {c:'confondere', t:'"It is said that..." vs "He is said to..."', b:'Col soggetto impersonale: <i>It is said <b>that</b> he is rich</i>. Con soggetto reale: <i>He is said <b>to be</b> rich</i>. Non mescolare le due strutture.'},
  {c:'falso', t:'Falsi amici accademici', b:'<b>eventually</b>=alla fine, <b>actually</b>=in realtà, <b>consistent</b>=coerente/costante (non "consistente"=substantial), <b>ingenuity</b>=ingegnosità (non "ingenuità"=naivety).'},
  {c:'confondere', t:'"in case" vs "if"', b:'<b>in case</b> = per precauzione, prima che accada (Take an umbrella in case it rains). <b>if</b> = condizione (Open it if it rains). Non sono intercambiabili.'},
  {c:'errore', t:'Mixed conditionals', b:'Condizione passata → risultato presente: <i>If I had saved, I <b>would be</b> rich now</i> (non "would have been"). Allinea il tempo del risultato al momento giusto.'},
  {c:'confondere', t:'"despite / however / whereas"', b:'<b>despite</b> + nome/-ing, <b>however</b> avverbio tra due frasi (; however,), <b>whereas/while</b> per contrasto diretto tra due idee in una frase.'}

  {c:'confondere', t:'Collocations native', b:'Abbinamenti fissi: <b>do</b> research/business/harm, <b>make</b> a decision/an effort/progress, <b>heavy</b> rain/traffic, <b>strong</b> coffee/accent. Sbagliare verbo tradisce subito il non nativo.'}
