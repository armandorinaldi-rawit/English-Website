<script>
(function(){
  const C = window.CURRICULUM;
  const LEVELS = ['A1','A2','B1','B2','C1','C2'];
  const LEVEL_NAME = {A1:'Principiante',A2:'Elementare',B1:'Intermedio',B2:'Intermedio-avanzato',C1:'Avanzato',C2:'Padronanza'};
  const KEY = 'englishTrainer.v2';

  let S = load();
  S.level = S.level || 'A1';
  S.tab = S.tab || 'today';
  S.streak = S.streak || 0;
  S.completed = S.completed || 0;        // lezioni completate
  S.correctTotal = S.correctTotal || 0;  // risposte corrette totali
  S.completedDates = S.completedDates || [];
  S.lastCompleted = S.lastCompleted || null;
  S.bestByTopic = S.bestByTopic || {};   // id -> miglior punteggio %

  function load(){ try { return JSON.parse(localStorage.getItem(KEY))||{}; } catch(e){ return {}; } }
  function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  // ---- audio (text-to-speech) ----
  var TTS = ('speechSynthesis' in window);
  function speak(t){ if(!TTS||!t) return; try{ window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=0.92; window.speechSynthesis.speak(u);}catch(e){} }
  function spk(text){ if(!TTS) return ''; return '<button class="spk" data-spk="'+esc(text)+'" title="Ascolta la pronuncia">🔊</button>'; }
  document.addEventListener('click', function(e){ var b=e.target.closest && e.target.closest('.spk'); if(b){ e.preventDefault(); speak(b.getAttribute('data-spk')); } });
  function norm(s){ return (s||'').toString().toLowerCase().replace(/[.,!?;:"'`’]/g,'').replace(/\s+/g,' ').trim(); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function dayIndex(){ const d=new Date(); const start=new Date(d.getFullYear(),0,0); return Math.floor((d-start)/86400000); }

  const $view = document.getElementById('view');
  function refreshStats(){
    document.getElementById('streak').textContent = S.streak;
    document.getElementById('done').textContent = S.completed;
    document.getElementById('acc').textContent = S.correctTotal;
  }

  // ---- level selector ----
  const seg = document.getElementById('levelSeg');
  function paintLevel(){ seg.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.lv===S.level)); }
  seg.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ S.level=b.dataset.lv; save(); paintLevel(); render(); });

  // ---- tabs ----
  const tabsEl = document.getElementById('tabs');
  function paintTabs(){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.tab===S.tab)); }
  tabsEl.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ S.tab=b.dataset.tab; save(); paintTabs(); render(); });

  document.getElementById('resetBtn').onclick = ()=>{
    if(confirm('Vuoi azzerare tutti i progressi (streak, lezioni, punteggi)?')){
      localStorage.removeItem(KEY); S = load();
      S.level='A1'; S.tab='today'; S.streak=0; S.completed=0; S.correctTotal=0;
      S.completedDates=[]; S.lastCompleted=null; S.bestByTopic={};
      save(); paintLevel(); paintTabs(); refreshStats(); render();
    }
  };

  // ---- quiz rendering ----
  function renderQuestion(q, onAnswer){
    const div = document.createElement('div'); div.className='q';
    const labels = {mc:'Scelta multipla', fill:'Completa la frase', tr:'Traduzione IT→EN', corr:"Correggi l'errore"};
    if(q.ty==='mc'){
      div.innerHTML = `<div class="q-type">${labels.mc}</div><div class="q-text">${esc(q.q)}</div><div class="opts"></div><div class="fb"></div>`;
      const opts=div.querySelector('.opts'), fb=div.querySelector('.fb');
      q.o.forEach((opt,oi)=>{
        const b=document.createElement('button'); b.className='opt'; b.textContent=opt;
        b.onclick=()=>{ const all=opts.querySelectorAll('.opt'); all.forEach(x=>x.disabled=true);
          const ok=oi===q.a; b.classList.add(ok?'correct':'wrong'); if(!ok&&all[q.a]) all[q.a].classList.add('correct');
          fb.className='fb '+(ok?'ok':'no');
          fb.innerHTML=(ok?'✅ Corretto! ':'❌ Non esatto. ')
            + (ok?'':'<span class="expl"><b>Risposta giusta:</b> '+esc(q.o[q.a])+' '+spk(q.o[q.a])+'</span>')
            + (q.e?'<span class="expl">💡 '+esc(q.e)+'</span>':'');
          onAnswer(ok); };
        opts.appendChild(b);
      });
    } else {
      const shown = q.ty==='fill' ? esc((q.s||'').replace('___','______'))
                  : q.ty==='tr'   ? esc(q.it||'') : esc(q.w||'');
      const consegna = q.q || (q.ty==='tr'?'Traduci in inglese:':q.ty==='corr'?"Correggi l'errore:":'Completa:');
      div.innerHTML = `<div class="q-type">${labels[q.ty]}</div><div class="muted" style="margin:2px 0 6px">${esc(consegna)}</div>
        <div class="q-text">${shown}</div>
        <input class="txt" type="text" placeholder="Scrivi la tua risposta…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div><button class="check-btn">Verifica</button></div><div class="fb"></div>`;
      const input=div.querySelector('.txt'), btn=div.querySelector('.check-btn'), fb=div.querySelector('.fb');
      const check=()=>{ if(btn.disabled) return;
        const acc=[q.a].concat(q.acc||[]).map(norm).filter(Boolean);
        const ok=acc.includes(norm(input.value));
        input.disabled=true; btn.disabled=true; input.classList.add(ok?'correct':'wrong');
        fb.className='fb '+(ok?'ok':'no');
        fb.innerHTML=(ok?'✅ Corretto! ':'❌ Non esatto. ')
          +`<span class="expl"><b>Risposta${ok?'':' giusta'}:</b> <span class="sol">${esc(q.a)}</span> ${spk(q.a)}</span>`
          +(q.e?'<span class="expl">💡 '+esc(q.e)+'</span>':'');
        onAnswer(ok); };
      btn.onclick=check; input.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    }
    return div;
  }

  function runQuiz(container, questions, opts){
    opts = opts || {};
    let answered=0, correct=0;
    const bar = document.createElement('div'); bar.className='progress-bar'; bar.innerHTML='<div></div>';
    container.appendChild(bar);
    const qWrap = document.createElement('div'); container.appendChild(qWrap);
    const resWrap = document.createElement('div'); container.appendChild(resWrap);
    questions.forEach(q=> qWrap.appendChild(renderQuestion(q, ok=>{
      answered++; if(ok){ correct++; S.correctTotal++; refreshStats(); save(); }
      bar.firstElementChild.style.width = Math.round(answered/questions.length*100)+'%';
      if(answered===questions.length) finish();
    })));
    function finish(){
      const pct=Math.round(correct/questions.length*100);
      if(opts.topicId){ S.bestByTopic[opts.topicId]=Math.max(S.bestByTopic[opts.topicId]||0, pct); }
      if(opts.markDaily){
        const t=todayStr();
        if(!S.completedDates.includes(t)){
          S.completedDates.push(t); S.completed++;
          const y=new Date(); y.setDate(y.getDate()-1);
          const yStr=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
          S.streak = (S.lastCompleted===yStr)?S.streak+1 : 1; S.lastCompleted=t;
        }
      }
      save(); refreshStats();
      const msg = pct>=80?'Ottimo lavoro! 🎉' : pct>=50?'Bel lavoro, continua così! 💪' : 'Buon inizio, la pratica rende perfetti! 🌱';
      resWrap.innerHTML = `<div class="card center"><div class="result-score">${correct}/${questions.length}</div>
        <p style="font-weight:700;margin:6px 0 2px">${msg}</p>
        <p class="muted">${opts.markDaily?'Hai completato la lezione di oggi. 🔥':'Ottimo allenamento!'}</p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px">
          <button class="ghost-btn" id="againBtn">Riprova</button>
          ${opts.onNext?'<button class="cta-bright" id="nextBtn">🔄 Carica una nuova lezione</button>':''}
        </div></div>`;
      resWrap.scrollIntoView({behavior:'smooth',block:'nearest'});
      const ab=document.getElementById('againBtn'); if(ab) ab.onclick=render;
      const nb=document.getElementById('nextBtn'); if(nb) nb.onclick=opts.onNext;
    }
  }

  function lessonCard(topic){
    const ex=(topic.ex||[]).map(e=>`<div class="ex-row"><span class="en">${esc(e[0])}${spk(e[0])}</span><span class="it">${esc(e[1])}</span></div>`).join('');
    return `<div class="card"><h2 class="lesson-title">${esc(topic.t)}</h2>
      <div class="explain">${topic.g}</div>
      ${ex?`<div class="examples"><h3>Esempi</h3>${ex}</div>`:''}</div>`;
  }

  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  const QUIZ_N = 15; // domande per test
  // Estrae un batch di n domande dal pool del topic, preferendo quelle non ancora viste (backup per test sempre nuovi).
  function drawBatch(id, pool, n){
    n = Math.min(n||QUIZ_N, pool.length);
    S.served = S.served || {};
    let served = S.served[id] || [];
    let avail = []; for(let i=0;i<pool.length;i++){ if(served.indexOf(i)===-1) avail.push(i); }
    if(avail.length < n){ served = []; avail = []; for(let i=0;i<pool.length;i++) avail.push(i); } // ciclo esaurito → reset
    const pick = shuffle(avail).slice(0, n);
    S.served[id] = served.concat(pick);
    save();
    return pick.map(i=>pool[i]);
  }

  // ---- views ----
  function nextLesson(){ S.dailyOffset=(S.dailyOffset||0)+1; save(); viewToday(); window.scrollTo({top:0,behavior:'smooth'}); }

  function viewToday(){
    const topics=C[S.level]; const off=S.dailyOffset||0;
    const topic=topics[((dayIndex()+off)%topics.length+topics.length)%topics.length];
    $view.innerHTML = `<div class="card" style="padding:14px 18px"><span class="tag">Lezione del giorno · ${S.level} ${LEVEL_NAME[S.level]}</span>
      <div class="muted">Studia l'argomento, poi rispondi al quiz. Puoi chiudere e caricarne una nuova quando vuoi.</div></div>`;
    const c=document.createElement('div'); c.innerHTML=lessonCard(topic); $view.appendChild(c);
    const batch=drawBatch(topic.id, topic.qz, QUIZ_N);
    const qc=document.createElement('div'); qc.className='card';
    qc.innerHTML=`<p class="section-label">Quiz · ${batch.length} domande${topic.qz.length>batch.length?' (su '+topic.qz.length+' in archivio)':''}</p>`;
    $view.appendChild(qc);
    runQuiz(qc, batch, {markDaily:true, topicId:topic.id, onNext:nextLesson});
    const nav=document.createElement('div'); nav.className='center'; nav.style.margin='4px 0 10px';
    nav.innerHTML='<button class="link-skip" id="skipBtn">↪ Salta questa lezione e caricane un\'altra</button>';
    $view.appendChild(nav);
    nav.querySelector('#skipBtn').onclick=nextLesson;
  }

  function viewGrammar(){
    const topics=C[S.level];
    $view.innerHTML = `<div class="card" style="padding:14px 18px"><span class="tag">Grammatica ${S.level}</span>
      <div class="muted">${topics.length} argomenti. Tocca per aprire la spiegazione e gli esempi.</div></div>`;
    topics.forEach(t=>{
      const done=S.bestByTopic[t.id];
      const item=document.createElement('div'); item.className='grammar-item';
      const ex=(t.ex||[]).map(e=>`<div class="ex-row"><span class="en">${esc(e[0])}${spk(e[0])}</span><span class="it">${esc(e[1])}</span></div>`).join('');
      item.innerHTML=`<div class="grammar-head"><span>${esc(t.t)} ${done!=null?`<span class="badge-done">· quiz ${done}%</span>`:''}</span><span class="chev">▶</span></div>
        <div class="grammar-body"><div class="explain">${t.g}</div>${ex?`<div class="examples"><h3>Esempi</h3>${ex}</div>`:''}
        <div style="margin-top:12px"><button class="primary-btn" data-id="${t.id}">Esercitati su questo →</button></div></div>`;
      item.querySelector('.grammar-head').onclick=()=>item.classList.toggle('open');
      item.querySelector('.primary-btn').onclick=()=>{ S.tab='quiz'; S.quizTopic=t.id; save(); paintTabs(); render(); };
      $view.appendChild(item);
    });
  }

  function viewQuiz(){
    const topics=C[S.level];
    $view.innerHTML='';
    const head=document.createElement('div'); head.className='card'; head.style.padding='16px 18px';
    head.innerHTML=`<span class="tag">Esercizi ${S.level}</span><div class="muted">Scegli un argomento o allenati con un mix di tutte le domande del livello.</div>
      <div class="topic-picker" id="picker"></div>`;
    $view.appendChild(head);
    const picker=head.querySelector('#picker');
    const cur = S.quizTopic || 'MIX';
    const mk=(id,label)=>{ const c=document.createElement('button'); c.className='chip'+(cur===id?' active':''); c.textContent=label;
      c.onclick=()=>{ S.quizTopic=id; save(); render(); }; return c; };
    picker.appendChild(mk('MIX','🎲 Mix livello'));
    topics.forEach(t=> picker.appendChild(mk(t.id, t.t)));
    const genWrap=document.createElement('div'); genWrap.className='center'; genWrap.style.margin='2px 0 12px';
    genWrap.innerHTML='<button class="gen-btn" id="genBtn">🎲 Genera nuovo test</button>';
    $view.appendChild(genWrap);
    genWrap.querySelector('#genBtn').onclick=()=>viewQuiz();
    const qc=document.createElement('div'); qc.className='card'; $view.appendChild(qc);
    if(cur==='MIX'){
      let all=[]; topics.forEach(t=> t.qz.forEach(q=> all.push(q)));
      const sel=shuffle(all).slice(0, Math.min(QUIZ_N, all.length));
      qc.innerHTML=`<p class="section-label">Mix · ${sel.length} domande casuali da tutti gli argomenti ${S.level}</p>`;
      runQuiz(qc, sel, {});
    } else {
      const t=topics.find(x=>x.id===cur)||topics[0];
      const batch=drawBatch(t.id, t.qz, QUIZ_N);
      qc.innerHTML=`<p class="section-label">${esc(t.t)} · ${batch.length} domande${t.qz.length>batch.length?' (archivio: '+t.qz.length+')':''}</p>`;
      runQuiz(qc, batch, {topicId:t.id});
    }
  }

  function viewTips(){
    const items=(window.TIPS&&window.TIPS[S.level])||[];
    const CAT={falso:'🎭 Falso amico', errore:'⚠️ Errore comune', confondere:'🔀 Da non confondere'};
    $view.innerHTML=`<div class="card" style="padding:14px 18px"><span class="tag">Suggerimenti ${S.level}</span>
      <div class="muted">Trappole tipiche per chi parla italiano: falsi amici, errori comuni e cose da non confondere.</div></div>`;
    if(!items.length){ const d=document.createElement('div'); d.className='card'; d.innerHTML='<p class="muted">Nessun suggerimento per questo livello.</p>'; $view.appendChild(d); return; }
    items.forEach(it=>{
      const d=document.createElement('div'); d.className='tip-item';
      d.innerHTML=`<span class="tip-cat ${it.c}">${CAT[it.c]||'Suggerimento'}</span><h4>${esc(it.t)}</h4><p>${it.b}</p>`;
      $view.appendChild(d);
    });
  }

  function viewResources(){
    S.resSub = S.resSub || 'verbs';
    $view.innerHTML = `<div class="subnav" id="resSub">
      <button data-s="verbs">🔤 Verbi irregolari</button>
      <button data-s="phrasal">🔗 Phrasal verbs</button></div><div id="resBody"></div>`;
    const sub=$view.querySelector('#resSub'); const body=$view.querySelector('#resBody');
    sub.querySelectorAll('button').forEach(b=>{ b.classList.toggle('active', b.dataset.s===S.resSub);
      b.onclick=()=>{ S.resSub=b.dataset.s; save(); viewResources(); }; });
    if(S.resSub==='verbs') resVerbs(body); else resPhrasal(body);
  }

  function resVerbs(body){
    const data=window.IRREGULAR||[];
    const head=document.createElement('div'); head.className='card'; head.style.padding='16px 18px';
    head.innerHTML=`<span class="tag">Verbi irregolari · ${data.length}</span>
      <div class="muted">Tabella base / past simple / participio passato. Cerca un verbo o allenati col quiz.</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="gen-btn" id="vquiz">🎲 Quiz verbi irregolari</button></div>`;
    body.innerHTML=''; body.appendChild(head);
    const card=document.createElement('div'); card.className='card'; body.appendChild(card);
    card.innerHTML=`<input class="search" id="vsearch" placeholder="Cerca un verbo (es. go, comprare)…">
      <div style="overflow-x:auto"><table class="vtable"><thead><tr><th>Base</th><th>Past</th><th>Participle</th><th>Italiano</th></tr></thead><tbody id="vbody"></tbody></table></div>`;
    const tb=card.querySelector('#vbody');
    function paint(f){ f=(f||'').toLowerCase().trim(); tb.innerHTML='';
      data.filter(r=> !f || r.join(' ').toLowerCase().includes(f)).forEach(r=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${esc(r[0])}${spk(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="it">${esc(r[3])}</td>`;
        tb.appendChild(tr); }); }
    paint('');
    card.querySelector('#vsearch').addEventListener('input',e=>paint(e.target.value));
    head.querySelector('#vquiz').onclick=()=>{
      const sel=shuffle(data).slice(0,10);
      const qs=sel.map(r=>{
        const askPart=Math.random()<0.5;
        const ans = askPart ? r[2] : r[1];
        return {ty:'fill', q:(askPart?'Participio passato':'Past simple')+' di "'+r[0]+'" ('+r[3]+'):', s:r[0]+' → ___',
          a:ans.split('/')[0], acc:ans.split('/'), e:r[0]+' – '+r[1]+' – '+r[2]+'.'};
      });
      const qc=document.createElement('div'); qc.className='card';
      qc.innerHTML='<p class="section-label">Quiz · 10 verbi a caso</p>';
      body.innerHTML=''; const back=document.createElement('button'); back.className='ghost-btn'; back.textContent='← Torna alla tabella'; back.style.marginBottom='12px'; back.onclick=()=>viewResources();
      body.appendChild(back); body.appendChild(qc); runQuiz(qc, qs, {});
    };
  }

  function resPhrasal(body){
    const data=window.PHRASAL||[];
    let all=[]; data.forEach(g=> g.items.forEach(it=> all.push(it)));
    const head=document.createElement('div'); head.className='card'; head.style.padding='16px 18px';
    head.innerHTML=`<span class="tag">Phrasal verbs · ${all.length}</span>
      <div class="muted">Raccolta per tema con significato ed esempio. Cerca o fai il quiz sui significati.</div>
      <div style="margin-top:10px"><button class="gen-btn" id="pquiz">🎲 Quiz phrasal verbs</button></div>`;
    body.innerHTML=''; body.appendChild(head);
    const card=document.createElement('div'); card.className='card'; body.appendChild(card);
    card.innerHTML=`<input class="search" id="psearch" placeholder="Cerca un phrasal verb o significato…"><div id="plist"></div>`;
    const list=card.querySelector('#plist');
    function paint(f){ f=(f||'').toLowerCase().trim(); list.innerHTML='';
      data.forEach(g=>{
        const rows=g.items.filter(it=> !f || (it[0]+' '+it[1]+' '+it[2]).toLowerCase().includes(f));
        if(!rows.length) return;
        const h=document.createElement('div'); h.className='ph-theme'; h.textContent=g.theme; list.appendChild(h);
        const t=document.createElement('div'); t.style.overflowX='auto';
        t.innerHTML='<table class="vtable"><tbody>'+rows.map(it=>`<tr><td>${esc(it[0])}${spk(it[0])}</td><td class="it">${esc(it[1])}</td><td><i>${esc(it[2])}</i>${spk(it[2])}</td></tr>`).join('')+'</tbody></table>';
        list.appendChild(t);
      });
    }
    paint('');
    card.querySelector('#psearch').addEventListener('input',e=>paint(e.target.value));
    head.querySelector('#pquiz').onclick=()=>{
      const sel=shuffle(all).slice(0,10);
      const qs=sel.map(it=>{
        const others=shuffle(all.filter(x=>x[1]!==it[1])).slice(0,3).map(x=>x[1]);
        const opts=shuffle([it[1]].concat(others));
        return {ty:'mc', q:'Cosa significa "'+it[0]+'"?', o:opts, a:opts.indexOf(it[1]), e:it[0]+' = '+it[1]+'. Es.: '+it[2]};
      });
      const qc=document.createElement('div'); qc.className='card';
      qc.innerHTML='<p class="section-label">Quiz · 10 phrasal verbs a caso</p>';
      body.innerHTML=''; const back=document.createElement('button'); back.className='ghost-btn'; back.textContent='← Torna alla lista'; back.style.marginBottom='12px'; back.onclick=()=>viewResources();
      body.appendChild(back); body.appendChild(qc); runQuiz(qc, qs, {});
    };
  }

  function viewVocab(){
    const data=window.VOCAB||[];
    S.vocabLearned = S.vocabLearned || 0;
    if(S.vocabIdx==null || S.vocabIdx>=data.length) S.vocabIdx=Math.floor(Math.random()*data.length);
    const w=data[S.vocabIdx];
    $view.innerHTML = `<div class="card" style="padding:14px 18px"><span class="tag">Vocaboli · ${data.length} parole</span>
      <div class="muted">Una parola alla volta: ascolta la pronuncia, leggi significato ed esempio, poi genera la prossima.</div></div>
      <div class="card vocab-card">
        <div class="vocab-pos">${esc(w[1])}</div>
        <div class="vocab-word">${esc(w[0])}</div>
        <button class="spk-big" data-spk="${esc(w[0])}">🔊 Ascolta la parola</button>
        <div class="vocab-mean">${esc(w[2])}</div>
        <div class="vocab-ex">${esc(w[3])} <button class="spk" data-spk="${esc(w[3])}" title="Ascolta la frase">🔊</button></div>
        <button class="cta-bright" id="newWord">🎲 Nuova parola</button>
      </div>`;
    $view.querySelector('#newWord').onclick=()=>{
      let n; do { n=Math.floor(Math.random()*data.length); } while(data.length>1 && n===S.vocabIdx);
      S.vocabIdx=n; S.vocabLearned++; save(); viewVocab(); speak(data[S.vocabIdx][0]);
    };
  }

  function render(){
    refreshStats();
    if(S.tab==='today') viewToday();
    else if(S.tab==='grammar') viewGrammar();
    else if(S.tab==='tips') viewTips();
    else if(S.tab==='res') viewResources();
    else if(S.tab==='vocab') viewVocab();
    else viewQuiz();
  }

  paintLevel(); paintTabs(); render();
})();
</script>
</body>
</html>
